<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaze Ball Tracker | Advanced Eye Matching</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #d9d0b4;
            --primary: #5a9e2f;
            --secondary: #4a8a25;
            --accent: #2d7a0e;
            --text-main: #3b2d1a;
            --text-muted: #6b5d4a;
            --stone: #c8bfa8;
            --stone-dark: #e8e0cc;
            --stone-light: #b8a88a;
            --dirt: #8b6f3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'VT323', monospace;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            image-rendering: pixelated;
        }

        /* Canvas Layer */
        #game-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Panels — Minecraft inventory style */
        .panel {
            background: var(--stone-dark);
            border: 4px solid #000;
            outline: 4px solid var(--stone-light);
            outline-offset: -8px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow:
                inset 2px 2px 0px #f5f0e0,
                inset -2px -2px 0px var(--stone-light),
                8px 8px 0px rgba(0, 0, 0, 0.15);
            pointer-events: auto;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s ease;
            display: none;
        }

        .panel.active {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        h1 {
            font-family: 'VT323', monospace;
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--accent);
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.15);
            font-weight: 400;
            letter-spacing: 2px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 2rem;
            font-size: 1.4rem;
            font-family: 'VT323', monospace;
        }

        .btn {
            background: var(--primary);
            border: 3px solid #000;
            box-shadow:
                inset 2px 2px 0px #7ece4f,
                inset -2px -2px 0px #3a7a1a;
            padding: 12px 32px;
            color: #fff;
            font-family: 'VT323', monospace;
            font-weight: 400;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
        }

        .btn:hover {
            background: #6ebe3f;
            box-shadow:
                inset 2px 2px 0px #8ede5f,
                inset -2px -2px 0px #4a8a2a;
        }

        .btn:active {
            box-shadow:
                inset -2px -2px 0px #7ece4f,
                inset 2px 2px 0px #3a7a1a;
            transform: translate(2px, 2px);
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 50;
            color: var(--text-muted);
            font-family: 'VT323', monospace;
            font-size: 16px;
            pointer-events: none;
            text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.1);
        }

        #webcam-preview {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border: 3px solid #000;
            box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.1);
            opacity: 0.4;
            transform: scaleX(-1);
            transition: opacity 0.3s;
            z-index: 90;
            image-rendering: pixelated;
        }

        #webcam-preview:hover {
            opacity: 1;
        }

        /* Loader — Minecraft style spinning */
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid var(--stone);
            border-top-color: var(--accent);
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="ambient-glow"></div>
    <canvas id="game-canvas"></canvas>

    <div id="hud">
        STATUS: <span id="status-text">INIT</span><br>
    </div>

    <video id="webcam-preview" autoplay playsinline muted></video>

    <!-- UI Overlay -->
    <div id="ui-layer">

        <!-- START PANEL -->
        <div id="panel-start" class="panel active">
            <div class="loader" id="init-loader"></div>
            <h1>Gaze Ball Tracker</h1>
            <p>
                Follow the moving balls with your eyes.<br>
                The system will detect the <strong>shape</strong> of your head movement to guess which ball you are
                watching.
            </p>
            <button class="btn" id="btn-start" disabled>Start Game</button>
            <p style="font-size: 0.8rem; margin-top: 20px; opacity: 0.5;">
                No Calibration Required • 5s Recording
            </p>
        </div>

        <!-- TRACKING PANEL (Hidden during play, shows results) -->
        <div id="panel-result" class="panel">
            <h1>Match Found!</h1>
            <p id="result-desc">You were looking at the Red Ball.</p>
            <div style="font-size: 3rem; margin-bottom: 20px;" id="result-icon">🔴</div>
            <p style="font-size: 0.9rem; color: var(--secondary);">Confidence: <span id="confidence-val">95%</span></p>
            <button class="btn" id="btn-restart">Play Again</button>
        </div>

    </div>

    <!-- AUDIO CONTEXT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type = 'sine', dur = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.type = type;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur + 0.1);
        }
    </script>

    <!-- LOGIC -->
    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- DOM Elements ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('webcam-preview');
        const panelStart = document.getElementById('panel-start');
        const panelResult = document.getElementById('panel-result');
        const btnStart = document.getElementById('btn-start');
        const btnRestart = document.getElementById('btn-restart');
        const statusText = document.getElementById('status-text');
        const initLoader = document.getElementById('init-loader');

        // --- Game State ---
        let gameState = 'LOADING'; // LOADING, IDLE, TRACKING, RESULT
        let faceLandmarker = null;
        let lastVideoTime = -1;

        // Gaze Tracking (Iris + Nose fused)
        let smoothIris = { x: 0.5, y: 0.5 }; // Smoothed iris gaze
        let smoothNose = { x: 0.5, y: 0.5 }; // Smoothed nose pointing
        let lastRecordedVideoTime = -1; // To deduplicate webcam frames

        // Recording
        let recordingData = []; // {t, ix, iy, nx, ny} — iris and nose
        let recordingActive = false;
        let recordingStartTime = 0;
        const RECORD_DURATION = 20000; // Max 20 seconds
        const CHECK_START = 5000; // Start checking at 5s
        const CHECK_INTERVAL = 2000; // Re-check every 2s
        const CONFIDENCE_GAP = 0.05; // Min gap between #1 and #2 to be confident
        let checkTimer = null;

        // Balls
        const balls = [];
        const BALL_COUNT = 5;
        const COLORS = ['#FF0055', '#00F2FE', '#FFE600', '#00FF99', '#B721FF'];
        const EMOJIS = ['🔴', '🔵', '🟡', '🟢', '🟣'];

        // --- Initialization ---
        async function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            try {
                const filesetResolver = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: true,
                    runningMode: "VIDEO",
                    numFaces: 1
                });

                statusText.innerText = "READY";
                initLoader.style.display = 'none';
                btnStart.disabled = false;
                btnStart.innerText = "Start Game";

                initBalls();
                requestAnimationFrame(loop);

            } catch (e) {
                console.error(e);
                statusText.innerText = "ERROR LOADING AI";
            }
        }

        function initBalls() {
            balls.length = 0;
            for (let i = 0; i < BALL_COUNT; i++) {
                balls.push({
                    id: i,
                    color: COLORS[i % COLORS.length],
                    emoji: EMOJIS[i % EMOJIS.length],
                    x: 0.5, y: 0.5,
                    radius: 25,
                    phase: (i / BALL_COUNT) * Math.PI * 2,
                    history: []
                });
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // --- Interactions ---
        btnStart.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    startGame();
                    predictWebcam();
                });
                panelStart.classList.remove('active');
            } catch (e) {
                alert("Camera access denied!");
            }
        });

        btnRestart.addEventListener('click', () => {
            panelResult.classList.remove('active');
            recordingActive = false;
            if (checkTimer) clearInterval(checkTimer);
            startGame();
        });

        function startGame() {
            gameState = 'TRACKING';

            // Reset all balls
            recordingData = [];
            recordingStartTime = performance.now();
            recordingActive = true;
            explosionParticles = [];
            balls.forEach(b => b.exploded = false);

            startRound();
        }

        // Start a new round of tracking (same game, just reset recording)
        function startRound() {
            recordingData = [];
            recordingStartTime = performance.now();
            recordingActive = true;

            if (checkTimer) clearInterval(checkTimer);
            checkTimer = null;

            // Count remaining active balls
            const activeBalls = balls.filter(b => !b.exploded);
            console.log(`--- Round start: ${activeBalls.length} balls remaining ---`);

            if (activeBalls.length <= 1) {
                // Last ball standing — explode it too as finale!
                if (activeBalls.length === 1) {
                    const lastBall = activeBalls[0];
                    setTimeout(() => {
                        playBoom();
                        spawnExplosion(lastBall.x, lastBall.y, lastBall.color);
                        lastBall.exploded = true;

                        setTimeout(() => {
                            gameState = 'RESULT';
                            recordingActive = false;
                            document.getElementById('result-desc').innerHTML = `All balls eliminated! 🎯`;
                            document.getElementById('result-icon').innerText = '🏆';
                            document.getElementById('confidence-val').innerText = 'Game Over';
                            panelResult.classList.add('active');
                        }, 1500);
                    }, 500);
                }
                return;
            }

            setTimeout(() => {
                if (gameState !== 'TRACKING') return;
                const result = tryAnalyze();
                if (result) return;

                checkTimer = setInterval(() => {
                    if (gameState !== 'TRACKING') {
                        clearInterval(checkTimer);
                        return;
                    }
                    const elapsed = performance.now() - recordingStartTime;
                    const result = tryAnalyze(elapsed >= RECORD_DURATION);
                    if (result) {
                        clearInterval(checkTimer);
                    }
                }, CHECK_INTERVAL);
            }, CHECK_START);
        }

        // Try to analyze — returns true if we got a confident result (or forced)
        function tryAnalyze(forceResult = false) {
            if (recordingData.length < 30) return false;

            const activeBalls = balls.filter(b => !b.exploded);
            if (activeBalls.length <= 1) return false;

            const timestamps = recordingData.map(d => d.t);
            let scores = [];

            activeBalls.forEach(ball => {
                const ballPathX = [];
                const ballPathY = [];

                timestamps.forEach(t => {
                    const pos = calculateBallPos(ball, t / 1000);
                    ballPathX.push(pos.x);
                    ballPathY.push(pos.y);
                });

                const ballVX = computeDerivative(ballPathX);
                const ballVY = computeDerivative(ballPathY);
                const ballAX = computeDerivative(ballVX);
                const ballAY = computeDerivative(ballVY);

                // IRIS signal
                const irisX = recordingData.map(d => d.ix);
                const irisY = recordingData.map(d => d.iy);
                const irisVX = computeDerivative(irisX);
                const irisVY = computeDerivative(irisY);
                const irisAX = computeDerivative(irisVX);
                const irisAY = computeDerivative(irisVY);

                const irisPosScore = (pearsonCorrelation(irisX, ballPathX) + pearsonCorrelation(irisY, ballPathY)) / 2;
                const irisVelScore = (pearsonCorrelation(irisVX, ballVX) + pearsonCorrelation(irisVY, ballVY)) / 2;
                const irisAccScore = (pearsonCorrelation(irisAX, ballAX) + pearsonCorrelation(irisAY, ballAY)) / 2;
                const irisTotal = irisPosScore * 0.25 + irisVelScore * 0.50 + irisAccScore * 0.25;

                // NOSE signal
                const noseX = recordingData.map(d => d.nx);
                const noseY = recordingData.map(d => d.ny);
                const noseVX = computeDerivative(noseX);
                const noseVY = computeDerivative(noseY);
                const noseAX = computeDerivative(noseVX);
                const noseAY = computeDerivative(noseVY);

                const nosePosScore = (pearsonCorrelation(noseX, ballPathX) + pearsonCorrelation(noseY, ballPathY)) / 2;
                const noseVelScore = (pearsonCorrelation(noseVX, ballVX) + pearsonCorrelation(noseVY, ballVY)) / 2;
                const noseAccScore = (pearsonCorrelation(noseAX, ballAX) + pearsonCorrelation(noseAY, ballAY)) / 2;
                const noseTotal = nosePosScore * 0.25 + noseVelScore * 0.50 + noseAccScore * 0.25;

                const totalScore = irisTotal * 0.6 + noseTotal * 0.4;

                scores.push({
                    id: ball.id,
                    score: totalScore,
                    iris: irisTotal,
                    nose: noseTotal,
                    ball: ball
                });
            });

            scores.sort((a, b) => b.score - a.score);
            const winner = scores[0];
            const gap = scores.length > 1 ? winner.score - scores[1].score : 1;
            const confident = winner.score >= 0.15 && gap >= CONFIDENCE_GAP;

            const elapsed = ((performance.now() - recordingStartTime) / 1000).toFixed(1);
            const remaining = balls.filter(b => !b.exploded).length;
            console.log(`[${elapsed}s] (${remaining} balls) Best: Ball ${winner.id + 1} (${winner.score.toFixed(3)}) gap: ${gap.toFixed(3)} ${confident ? '✅' : '⏳'}`);
            console.table(scores.map(s => ({
                ball: s.id + 1,
                total: s.score.toFixed(3),
                iris: s.iris.toFixed(3),
                nose: s.nose.toFixed(3)
            })));

            if (confident || forceResult) {
                // FOUND ONE — blast it and continue!
                const winBall = winner.ball;
                playBoom();
                spawnExplosion(winBall.x, winBall.y, winBall.color);
                winBall.exploded = true;

                if (checkTimer) clearInterval(checkTimer);
                recordingActive = false;

                console.log(`💥 Eliminated Ball ${winBall.id + 1}!`);

                // After explosion settles, start next round
                setTimeout(() => {
                    startRound();
                }, 2000);

                return true;
            }

            return false;
        }

        // --- Explosion Particle System ---
        let explosionParticles = [];

        function spawnExplosion(cx, cy, color) {
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 8;
                explosionParticles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 4 + Math.random() * 8,
                    color: color,
                    life: 1.0, // 1.0 → 0.0
                    decay: 0.01 + Math.random() * 0.02
                });
            }
        }

        function updateAndDrawExplosion() {
            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                const p = explosionParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.96; // friction
                p.vy *= 0.96;
                p.vy += 0.15; // gravity
                p.life -= p.decay;

                if (p.life <= 0) {
                    explosionParticles.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1.0;
        }

        // --- Boom Sound (Web Audio API) ---
        function playBoom() {
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                // Low rumble
                const osc1 = actx.createOscillator();
                const gain1 = actx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(80, actx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(20, actx.currentTime + 0.5);
                gain1.gain.setValueAtTime(1.0, actx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.6);
                osc1.connect(gain1).connect(actx.destination);
                osc1.start();
                osc1.stop(actx.currentTime + 0.6);

                // Noise burst (crackle)
                const bufferSize = actx.sampleRate * 0.3;
                const noiseBuffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
                }
                const noise = actx.createBufferSource();
                noise.buffer = noiseBuffer;
                const noiseGain = actx.createGain();
                noiseGain.gain.setValueAtTime(0.6, actx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.3);
                noise.connect(noiseGain).connect(actx.destination);
                noise.start();
            } catch (e) { /* ignore audio errors */ }
        }

        // Compute first-order derivative (finite differences)
        function computeDerivative(signal) {
            const d = [];
            for (let i = 1; i < signal.length; i++) {
                d.push(signal[i] - signal[i - 1]);
            }
            return d;
        }

        // Standard Pearson Correlation Formula
        function pearsonCorrelation(x, y) {
            const n = Math.min(x.length, y.length);
            if (n < 2) return 0;

            let sumX = 0, sumY = 0, sumX2 = 0, sumY2 = 0, sumXY = 0;
            for (let i = 0; i < n; i++) {
                sumX += x[i];
                sumY += y[i];
                sumX2 += x[i] * x[i];
                sumY2 += y[i] * y[i];
                sumXY += x[i] * y[i];
            }

            const numerator = (n * sumXY) - (sumX * sumY);
            const denominator = Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY));

            if (denominator === 0) return 0;
            return numerator / denominator;
        }

        // --- Core Loop ---
        function loop(timestamp) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const timeSec = timestamp / 1000;

            if (gameState === 'TRACKING' || gameState === 'RESULT') {
                balls.forEach(b => {
                    const pos = calculateBallPos(b, timeSec);
                    b.x = pos.x * canvas.width;
                    b.y = pos.y * canvas.height;

                    // Skip drawing exploded balls
                    if (b.exploded) return;

                    // Trail
                    b.history.push({ x: b.x, y: b.y });
                    if (b.history.length > 25) b.history.shift();

                    // Draw Trail
                    if (b.history.length > 2) {
                        ctx.beginPath();
                        ctx.moveTo(b.history[0].x, b.history[0].y);
                        for (let i = 1; i < b.history.length; i++) {
                            ctx.lineTo(b.history[i].x, b.history[i].y);
                        }
                        ctx.strokeStyle = b.color;
                        ctx.lineWidth = 2;
                        ctx.globalAlpha = 0.3;
                        ctx.stroke();
                        ctx.globalAlpha = 1.0;
                    }

                    // Draw Ball
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.shadowColor = b.color;
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Shiny reflection
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.beginPath();
                    ctx.arc(b.x - 8, b.y - 8, 6, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Draw explosion particles
            updateAndDrawExplosion();

            // Progress Bar
            if (recordingActive) {
                const elapsed = timestamp - recordingStartTime;
                const pct = Math.min(1, elapsed / RECORD_DURATION);
                ctx.fillStyle = '#2196f3';
                ctx.fillRect(0, canvas.height - 5, canvas.width * pct, 5);

                // Only record when we have a NEW webcam frame (avoid duplicates)
                if (window.currentGazeData && window.currentGazeData.videoTime !== lastRecordedVideoTime) {
                    lastRecordedVideoTime = window.currentGazeData.videoTime;
                    recordingData.push({
                        t: timestamp,
                        ix: smoothIris.x,
                        iy: smoothIris.y,
                        nx: smoothNose.x,
                        ny: smoothNose.y
                    });
                }
            }

            requestAnimationFrame(loop);
        }

        // --- Logic: Ball Paths with Sudden Direction Changes ---
        // All paths are CONTINUOUS (no jumps). The ball smoothly moves,
        // but at certain moments its direction sharply reverses or turns.

        // Triangle wave: smoothly goes 0→1→0→1... (continuous, sharp turns at peaks)
        function triangleWave(t, period) {
            const p = ((t % period) + period) % period;
            const half = period / 2;
            return p < half ? p / half : 1 - (p - half) / half;
        }

        function calculateBallPos(b, t) {
            const speed = 1.5;
            let x = 0.5, y = 0.5;
            const amp = 0.42;
            const st = t * speed + b.phase; // speed-adjusted time with phase offset

            switch (b.id) {
                case 0: // Horizontal bounce — reverses every 3.5s
                    x = 0.5 + amp * (triangleWave(st, 7.0) * 2 - 1);
                    y = 0.5 + 0.08 * Math.sin(st * 0.4);
                    break;

                case 1: // Horizontal bounce — reverses every 2.25s with gentle vertical drift
                    x = 0.5 + amp * (triangleWave(st, 4.5) * 2 - 1);
                    y = 0.5 + 0.08 * Math.sin(st * 0.5);
                    break;

                case 2: // Diagonal bounce — X reverses every 5.5s, Y reverses every 3s
                    x = 0.5 + amp * (triangleWave(st, 11.0) * 2 - 1);
                    y = 0.5 + amp * (triangleWave(st, 6.0) * 2 - 1);
                    break;

                case 3: // Anti-diagonal bounce — Y reverses every 4s, X reverses every 2.5s
                    x = 0.5 + amp * (triangleWave(st, 5.0) * 2 - 1);
                    y = 0.5 - amp * (triangleWave(st, 8.0) * 2 - 1);
                    break;

                case 4: // L-shaped path — changes axis every ~3.3s
                    {
                        const cycle = 10.0;
                        const phase = ((st % cycle) + cycle) % cycle;
                        if (phase < 3.3) {
                            x = 0.5 - amp + (amp * 2) * (phase / 3.3);
                            y = 0.5 - amp;
                        } else if (phase < 6.6) {
                            x = 0.5 + amp;
                            y = 0.5 - amp + (amp * 2) * ((phase - 3.3) / 3.3);
                        } else {
                            const frac = (phase - 6.6) / 3.4;
                            x = 0.5 + amp - (amp * 2) * frac;
                            y = 0.5 + amp - (amp * 2) * frac;
                        }
                    }
                    break;
            }
            return { x, y };
        }

        // --- Logic: Webcam & Face (Iris-based Gaze) ---
        // Uses iris position relative to eye corners to compute gaze direction.
        // MediaPipe iris landmarks:
        //   Left iris center: 468, Right iris center: 473
        //   Left eye corners: inner=133, outer=33, top=159, bottom=145
        //   Right eye corners: inner=362, outer=263, top=386, bottom=374
        const SMOOTHING = 0.25; // EMA factor (0=no update, 1=no smoothing)

        async function predictWebcam() {
            let startTimeMs = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const results = faceLandmarker.detectForVideo(video, startTimeMs);

                if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                    const lm = results.faceLandmarks[0];

                    // --- Left eye gaze ---
                    const leftIris = lm[468];
                    const leftInner = lm[133];
                    const leftOuter = lm[33];
                    const leftTop = lm[159];
                    const leftBottom = lm[145];

                    const leftGazeX = (leftIris.x - leftOuter.x) / (leftInner.x - leftOuter.x);
                    const leftGazeY = (leftIris.y - leftTop.y) / (leftBottom.y - leftTop.y);

                    // --- Right eye gaze ---
                    const rightIris = lm[473];
                    const rightInner = lm[362];
                    const rightOuter = lm[263];
                    const rightTop = lm[386];
                    const rightBottom = lm[374];

                    const rightGazeX = (rightIris.x - rightOuter.x) / (rightInner.x - rightOuter.x);
                    const rightGazeY = (rightIris.y - rightTop.y) / (rightBottom.y - rightTop.y);

                    // Average both eyes
                    let gazeX = (leftGazeX + rightGazeX) / 2;
                    let gazeY = (leftGazeY + rightGazeY) / 2;

                    // Invert X because webcam is mirrored
                    gazeX = 1.0 - gazeX;

                    // Clamp to 0-1
                    gazeX = Math.max(0, Math.min(1, gazeX));
                    gazeY = Math.max(0, Math.min(1, gazeY));

                    // Apply EMA smoothing to iris
                    smoothIris.x += (gazeX - smoothIris.x) * SMOOTHING;
                    smoothIris.y += (gazeY - smoothIris.y) * SMOOTHING;

                    // --- Nose pointing ---
                    const nose = lm[1]; // Nose tip
                    let noseX = 1.0 - nose.x; // Invert for mirror
                    let noseY = nose.y;
                    smoothNose.x += (noseX - smoothNose.x) * SMOOTHING;
                    smoothNose.y += (noseY - smoothNose.y) * SMOOTHING;

                    // Expose to recording loop
                    window.currentGazeData = { videoTime: video.currentTime };
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        init();
    </script>
