<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CN's Lab — Interactive Experiments</title>
    <!-- <link rel="icon" type="image/png" href="images/favicon.png" sizes="any"> -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* --- GLOBAL RESET & TYPOGRAPHY --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.5;
            color: #333;
            background-color: #fdfdfd;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            /* No Scroll */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        h1,
        h2,
        h3 {
            font-family: 'EB Garamond', serif;
            font-weight: 700;
        }

        /* --- CONTAINER --- */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: center;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            max-width: 600px;
            margin-top: 1rem;
            font-weight: 300;
        }

        /* --- ANIMATED LOGO EXPANDER --- */
        .logo-expander {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .logo-letter,
        .logo-hidden {
            font-family: "Nothing You Could Do", cursive;
            font-weight: 400;
            font-style: normal;
            color: #222;
            font-size: 4rem;
            /* Big Header Size */
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.1);
            white-space: pre;
            line-height: 1;
        }

        /* The letters C, N, 's remain visible but might shift */
        .logo-letter {
            transition: transform 1.2s ease;
        }

        /* The parts that expand */
        .logo-hidden {
            display: inline-block;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            /* Slower duration and delay matching hover delay */
            transition: max-width 1.5s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 1.0s ease;
            vertical-align: bottom;
        }

        /* Hover States */
        /* Reveal the hidden parts with delay */
        .logo-expander:hover .logo-hidden {
            max-width: 500px;
            /* Big enough for expansion */
            opacity: 1;
            transition-delay: 0.2s;
            /* Faster response for header */
        }

        /* --- GRID --- */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            /* 5 Columns for single row */
            gap: 1.5rem;
            width: 100%;
            perspective: 1000px;
        }

        .game-card {
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            /* Subtle border */
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 220px;
            /* Fixed height for uniformity */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        /* Blue Accent Hover */
        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 86, 179, 0.15);
            /* Blue shadow */
            border-color: #0056b3;
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: block;
            transition: transform 0.3s ease;
        }

        .game-card:hover .card-icon {
            transform: scale(1.1);
        }

        .card-title {
            font-family: 'EB Garamond', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.4;
            font-weight: 300;
        }

        /* --- FOOTER --- */
        .footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #888;
            font-weight: 300;
            display: flex;
            gap: 1.5rem;
            animation: fadeInUp 0.8s ease-out;
        }

        .footer a:hover {
            color: #0056b3;
            text-decoration: underline;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 1024px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
            }

            .game-card {
                height: 200px;
            }

            .logo-letter,
            .logo-hidden {
                font-size: 3rem;
            }
        }

        @media (max-width: 768px) {
            body {
                height: auto;
                overflow-y: auto;
                /* Allow scroll on mobile */
                padding: 2rem 0;
            }

            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .logo-letter,
            .logo-hidden {
                font-size: 2.5rem;
            }

            .header {
                margin-bottom: 2rem;
            }
        }

        @media (max-width: 500px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-card {
            animation: cardEntrance 0.6s backwards;
        }

        .game-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .game-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .game-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .game-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .game-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

            <!-- Eye Cursor -->
            <a href="./eye_cursor.html" class="game-card">

            <!-- Gaze Balls -->
            <a href="./gaze_balls.html" class="game-card">

        </div>

        <footer class="footer">
            <span>&copy; 2026 CN's Lab</span>
            <a href="https://chathuranirmal.com" target="_blank">About Me</a>
            <a href="mailto:chathuranirmalweerasinghe@gmail.com">Contact</a>
        </footer>

    </div>

</body>

</html>
